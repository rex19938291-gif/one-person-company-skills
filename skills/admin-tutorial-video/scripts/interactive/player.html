<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="__BG__"><title>__TITLE__</title>
<style>
:root{color-scheme:light;__THEME__}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}main{max-width:1200px;margin:auto;min-width:0}a{color:var(--accent)}button{font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;min-height:44px;max-width:100%;text-wrap:balance}button:disabled{opacity:.45;cursor:default}button:active{transform:scale(.98)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1{font-size:30px;line-height:1.35;margin:20px 0 12px}h2{font-size:23px;line-height:1.45;margin:6px 0 12px}h1 span,h2 span,.crumb{display:inline-block}p,li{word-break:keep-all;margin-top:0;text-wrap:wrap;overflow-wrap:break-word}.short{text-wrap:balance}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.lede{color:var(--muted);max-width:900px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}.tab{font-weight:700}.tab[aria-selected=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}.scenario{margin:0 0 14px;color:var(--muted)}.location{font-size:22px;line-height:1.5;padding:14px 18px;background:var(--soft);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow-wrap:break-word}.location .prefix{font-size:17px;color:var(--muted)}.location strong{font-weight:800}.url{display:block;font-size:15px;overflow-wrap:break-word;margin-top:4px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.stage{position:relative;width:100%;aspect-ratio:var(--ratio);overflow:hidden;border-radius:12px;isolation:isolate;background:var(--monitor);border:1px solid var(--line)}.camera{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.shot{display:block;width:100%;height:100%;object-fit:fill}.spot{position:absolute;border:3px solid var(--focus);border-radius:5px;box-shadow:0 0 0 10000px var(--spot_shadow);pointer-events:none}.target{position:absolute;background:transparent;border:0;border-radius:5px;padding:0;min-height:0;outline-offset:0}.target:active{transform:none}.cursor{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--white);border:4px solid var(--focus);box-shadow:0 1px 5px var(--shadow);pointer-events:none;transform:translate(-50%,-50%)}.map{position:absolute;right:10px;bottom:10px;width:22%;border:2px solid var(--white);border-radius:6px;overflow:hidden;box-shadow:0 2px 8px var(--shadow);background:var(--white);pointer-events:none}.map img{display:block;width:100%;height:auto}.viewbox{position:absolute;border:2px solid var(--focus);background:transparent}.map[hidden]{display:none}.caption{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.count{color:var(--accent);font-size:15px;font-weight:700;margin-bottom:8px}.caption p{font-size:17px;line-height:1.75;margin-bottom:12px}.chips{display:grid;gap:8px}.chip{display:grid;gap:3px;padding:9px 11px;background:var(--soft);border-radius:8px;min-width:0}.chip b{font-size:15px;overflow-wrap:break-word}.chip span{font-size:15px;overflow-wrap:break-word}.phase{font-size:13px;color:var(--muted);margin-top:14px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}.controls .primary{background:var(--accent);color:var(--bg);font-weight:700}.dots{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.dot{min-width:44px;padding:7px}.dot[aria-current=step]{background:var(--accent);color:var(--bg)}.dot.done{border-color:var(--accent)}.notes{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.notes h2{font-size:20px}.notes ul{padding-left:22px;margin-bottom:0}.notes li{margin-bottom:10px}.help{font-size:14px;color:var(--muted);margin:14px 0}.error{position:absolute;inset:0;background:var(--panel);display:grid;place-content:center;padding:20px;color:var(--ink)}.error[hidden]{display:none}
@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr)}.caption{padding:16px}.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){body{padding:16px 12px calc(28px + env(safe-area-inset-bottom))}h1{font-size:25px}h2{font-size:21px}.location{font-size:17px;padding:12px}.location .prefix{font-size:14px}.map{right:6px;bottom:6px}.tabs{gap:6px}.tab{font-size:15px;padding:9px 10px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.controls button{padding:8px 5px;font-size:15px}.notes{padding:16px}.caption p{font-size:17px}.url{font-size:13px}.chips{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style></head><body><main>
<div class="header"><a href="../">返回教學總覽</a></div>
<h1 id="title">__TITLE__</h1><p class="lede" id="lede"></p>
<div class="tabs" id="tabs" role="tablist" aria-label="選擇操作情境"></div><p class="scenario short" id="scenario"></p>
<div class="location" id="location" aria-label="目前位置"></div>
<div class="workspace" id="panel" role="tabpanel"><div class="stage" id="stage" aria-label="操作示範畫面"><div class="camera" id="camera"><img class="shot" id="shot" alt=""><div class="spot" id="spot"></div><button class="target" id="target" aria-label="示範標示的操作"></button><div class="cursor" id="cursor" hidden></div></div><div class="map" id="map" hidden><img id="mapshot" alt="整頁位置縮圖"><div class="viewbox" id="viewbox"></div></div><div class="error" id="error" hidden>圖片暫時無法載入，請重新整理這一頁。</div></div>
<article class="caption" aria-live="polite"><div class="count" id="count"></div><h2 id="stepTitle"></h2><p id="description"></p><div class="chips" id="chips"></div><div class="phase" id="phase"></div></article></div>
<div class="controls"><button class="primary" id="play">自動播放</button><button id="prev">上一步</button><button id="next">下一步</button><button id="replay">重看這一步</button><button id="home">看整頁</button><button id="reset">從頭開始</button></div>
<div class="dots" id="dots" aria-label="選擇步驟"></div><p class="help">先看整頁，再推近紅框。可按紅框示範這一步；鍵盤 ← → 換步驟、空白鍵播放／暫停、Esc 暫停。</p>
<section class="notes"><h2>要記得的事</h2><ul id="notes"></ul></section>
</main><script id="manifest" type="application/json">__MANIFEST__</script><script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('manifest').textContent),$=id=>document.getElementById(id),W=D.capW,H=D.capH,stage=$('stage'),camera=$('camera'),shot=$('shot');
let key=Object.keys(D.scenes)[0],index=0,generation=0,delays=[],frame=0,auto=null,playing=false,phase='pre',view={x:0,y:0,s:1},zoomed=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function phrase(s){const words=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('zh-Hant',{granularity:'word'}).segment(String(s))].map(x=>x.segment):Array.from(String(s));const chunks=[];let part='';for(const word of words){if(part.length>=6&&part.length+word.length>10&&!/^[，、。？！：；）】」]/.test(word)){chunks.push(part);part=''}part+=word}if(part){if(part.length<3&&chunks.length&&chunks[chunks.length-1].length+part.length<=13)chunks[chunks.length-1]+=part;else chunks.push(part)}return chunks.map(t=>'<span>'+escape(t)+'</span>').join('')}
function crumbs(s){return String(s).split('›').map(t=>'<span class="crumb">'+escape(t.trim())+'</span>').join(' › ')}
const steps=()=>D.scenes[key].steps,current=()=>steps()[index];
function later(f,ms){delays.push(setTimeout(f,ms))}function clear(){generation++;delays.forEach(clearTimeout);delays=[];cancelAnimationFrame(frame)}
function homeView(){return {x:0,y:0,s:stage.clientWidth/W}}
function paint(v){view=v;$('spot').style.borderWidth=(2.5/v.s)+'px';camera.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.s})`;const b=$('viewbox');b.style.left=(-v.x/v.s/W*100)+'%';b.style.top=(-v.y/v.s/H*100)+'%';b.style.width=(stage.clientWidth/v.s/W*100)+'%';b.style.height=(stage.clientHeight/v.s/H*100)+'%';$('map').hidden=v.s/(stage.clientWidth/W)<=1.05}
function aim(r,z){const base=stage.clientWidth/W;if(index===0||z<=1.05)return homeView();const cx=Math.max(0,r.x-32),cy=Math.max(0,r.y-120),cw=Math.min(W-cx,r.w+64),ch=Math.min(H-cy,r.h+168);const mult=Math.max(1,Math.min(z,stage.clientWidth*.92/(cw*base),stage.clientHeight*.9/(ch*base))),s=base*mult;return {s,x:Math.min(0,Math.max(stage.clientWidth-W*s,stage.clientWidth/2-(cx+cw/2)*s)),y:Math.min(0,Math.max(stage.clientHeight-H*s,stage.clientHeight/2-(cy+ch/2)*s))}}
function move(to,instant=false){cancelAnimationFrame(frame);if(instant||reduced){paint(to);return}const from={...view},start=performance.now();function tick(now){const p=Math.min(1,(now-start)/680),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;paint({x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,s:from.s+(to.s-from.s)*e});if(p<1)frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick)}
function mark(r){for(const id of ['spot','target']){const b=$(id);b.style.left=r.x+'px';b.style.top=r.y+'px';b.style.width=r.w+'px';b.style.height=r.h+'px'}$('target').disabled=!current().click;const c=$('cursor');c.hidden=!current().click;c.style.left=(r.x+r.w*.55)+'px';c.style.top=(r.y+r.h*.6)+'px'}
function load(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(src);im.onerror=reject;im.src=src})}
async function showPhase(name,initial=false){const token=generation,s=current(),p=s[name];if(!p)return;try{await load(p.img);if(token!==generation)return;phase=name;shot.src=p.img;shot.alt=s.tt+'：'+(name==='pre'?'操作前':'操作後');$('mapshot').src=p.img;$('error').hidden=true;mark(p.r);$('phase').textContent=name==='pre'?(s.click?'紅框是要按的位置':'紅框是要看的區塊'):'操作後的畫面';if(!initial){move(aim(p.r,name==='post'?(s.spotZ||s.z):s.z));zoomed=true}}catch(e){if(token===generation){$('error').hidden=false;stop()}}}
function render(){const s=current();$('count').textContent=`第 ${index+1} 步／共 ${steps().length} 步`;$('stepTitle').innerHTML=phrase(s.tt);$('description').innerHTML=phrase(s.dd);$('chips').innerHTML=(s.chips||[]).map(([a,b])=>'<div class="chip"><b>'+escape(a)+'</b><span>'+escape(b)+'</span></div>').join('');$('location').innerHTML='<span class="prefix">'+crumbs(s.locp)+'</span> <strong>'+crumbs(s.loc)+'</strong>'+(s.url?'<a class="url" href="https://'+escape(s.url)+'" target="_blank" rel="noopener">'+escape(s.url)+'</a>':'');$('prev').disabled=index===0;$('next').disabled=index===steps().length-1;$('dots').innerHTML=steps().map((st,n)=>`<button class="dot ${n<index?'done':''}" data-step="${n}" aria-label="第 ${n+1} 步：${escape(st.tt)}" ${n===index?'aria-current="step"':''}>${n+1}</button>`).join('')}
async function show(n){if(n<0||n>=steps().length)return;clear();index=n;phase='pre';zoomed=false;render();paint(homeView());$('spot').hidden=true;$('cursor').hidden=true;$('target').hidden=true;const token=generation;await showPhase('pre',true);if(token!==generation||!$('error').hidden)return;$('spot').hidden=false;$('target').hidden=false;const s=current();later(()=>{move(aim(s.pre.r,s.z));zoomed=true},600);let t=1800;if(s.mid){later(()=>showPhase('mid'),t);t+=1100}if(s.post)later(()=>showPhase('post'),t+400)}
function stop(){playing=false;clearTimeout(auto);auto=null;$('play').textContent='自動播放';$('play').setAttribute('aria-pressed','false')}
function schedule(){auto=setTimeout(async()=>{if(!playing)return;if(index===steps().length-1){stop();return}await show(index+1);if(playing)schedule()},Math.max(4800,(current().dur||4.8)*1000+800))}
function toggle(){if(playing){stop();return}playing=true;$('play').textContent='暫停播放';$('play').setAttribute('aria-pressed','true');if(index===steps().length-1){show(0).then(()=>{if(playing)schedule()})}else schedule()}
function select(k){stop();key=k;index=0;document.querySelectorAll('.tab').forEach(b=>{const selected=b.dataset.key===k;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1});$('panel').setAttribute('aria-labelledby','tab-'+k);$('scenario').innerHTML=phrase(D.scenes[k].p+(D.scenes[k].must?'　'+D.scenes[k].must:''));show(0)}
$('title').innerHTML=phrase(D.title);$('lede').innerHTML=phrase(D.sub);$('notes').innerHTML=D.notes.map(s=>'<li>'+escape(s)+'</li>').join('');stage.style.setProperty('--ratio',W+'/'+H);camera.style.width=W+'px';camera.style.height=H+'px';$('tabs').innerHTML=Object.entries(D.scenes).map(([k,s])=>`<button class="tab" id="tab-${k}" role="tab" aria-controls="panel" data-key="${k}">${escape(s.h)}</button>`).join('');$('tabs').onclick=e=>{const b=e.target.closest('[data-key]');if(b)select(b.dataset.key)};$('dots').onclick=e=>{const b=e.target.closest('[data-step]');if(b){stop();show(+b.dataset.step)}};$('next').onclick=()=>{stop();show(index+1)};$('prev').onclick=()=>{stop();show(index-1)};$('play').onclick=toggle;$('replay').onclick=()=>{stop();show(index)};$('target').onclick=()=>{stop();clear();const s=current();if(s.mid){showPhase('mid');if(s.post)later(()=>showPhase('post'),1100)}else if(s.post)showPhase('post');else show(index)};$('home').onclick=()=>{stop();clear();move(homeView());zoomed=false};$('reset').onclick=()=>select(key);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.target.closest('[role=tablist]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const keys=Object.keys(D.scenes),at=keys.indexOf(key),to=e.key==='Home'?0:e.key==='End'?keys.length-1:(at+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length;select(keys[to]);$('tab-'+keys[to]).focus({preventScroll:true});return}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stop();show(index+(e.key==='ArrowRight'?1:-1))}if(e.code==='Space'&&!/BUTTON|A/.test(e.target.tagName)){e.preventDefault();toggle()}if(e.key==='Escape')stop()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});new ResizeObserver(()=>{cancelAnimationFrame(frame);const s=current(),p=s[phase]||s.pre;paint(zoomed?aim(p.r,phase==='post'?(s.spotZ||s.z):s.z):homeView())}).observe(stage);
select(key);
})();
function tailKeep(root){(root||document).querySelectorAll('p,li,#description,#scenario,#lede').forEach(el=>{if(el.querySelector('span.tk'))return;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),texts=[];let n;while(n=w.nextNode())texts.push(n);let need=6,node=null,off=0;for(let i=texts.length-1;i>=0;i--){const v=texts[i].nodeValue.replace(/\s+$/,'');if(v.length>=need){node=texts[i];off=v.length-need;break}need-=v.length}if(!node)return;if(el.textContent.trim().length<12)return;const r=document.createRange();r.setStart(node,off);r.setEnd(el,el.childNodes.length);const frag=r.extractContents();const sp=document.createElement('span');sp.className='tk';sp.style.whiteSpace='nowrap';sp.appendChild(frag);el.appendChild(sp)})}
new MutationObserver(()=>tailKeep()).observe(document.body,{subtree:true,childList:true});tailKeep();
</script></body></html>
